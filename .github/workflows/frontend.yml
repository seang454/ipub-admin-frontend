name: Deploy Next.js to GCP VM

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Prevent hanging builds

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ SSH into GCP VM and deploy
      - name: SSH into GCP VM and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCE_VM_IP }}
          username: ${{ secrets.GCE_VM_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            set -o pipefail

            # Function to log with timestamps
            log() {
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"
            }

            log "🚀 Starting deployment of docuhub-frontend to GCP VM..."

            # Check disk space before deployment
            log "💾 Checking disk space..."
            df -h / | tail -1 | awk '{print "Available disk space: " $4}'

            # 1️⃣ Cleanup old build artifacts and free disk space
            log "🧹 Cleaning up old artifacts..."
            docker system prune -af --filter "until=48h" || true
            sudo apt-get autoremove -y || true
            sudo apt-get clean || true

            # 1️⃣ Clone or update repo
            if [ -d "$HOME/docuhub-frontend/.git" ]; then
              log "📂 Repo exists, updating..."
              cd $HOME/docuhub-frontend
              
              # Stash any local changes
              git stash || true
              
              # Update remote URL with token for authentication
              git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/seang454/ipub-admin-frontend.git
              
              # Fetch and reset
              git fetch origin
              git reset --hard origin/main
              
              # Remove token from remote URL for security
              git remote set-url origin https://github.com/seang454/ipub-admin-frontend.git
              
              # Show current commit here
              log "Current commit: $(git log -1 --oneline)"
            else
              log "📂 Cloning repo..."
              git clone https://${{ secrets.PAT_TOKEN }}@github.com/seang454/ipub-admin-frontend.git $HOME/docuhub-frontend
              cd $HOME/docuhub-frontend
              
              # Remove token from remote URL for security
              git remote set-url origin https://github.com/seang454/ipub-admin-frontend.git
              
              log "Cloned commit: $(git log -1 --oneline)"
            fi

            # 2️⃣ Install Node.js (if not installed)
            if ! command -v node &> /dev/null || ! node -v | grep -q "20"; then
              log "🟢 Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            log "Node version: $(node -v)"
            log "NPM version: $(npm -v)"

            # 3️⃣ Create .env.production file from GitHub Secrets
            log "🔐 Creating .env.production..."
            cat > .env.production << 'EOF'
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            KEYCLOAK_CLIENT_ID=${{ secrets.KEYCLOAK_CLIENT_ID }}
            KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
            KEYCLOAK_ISSUER=${{ secrets.KEYCLOAK_ISSUER }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            REACT_APP_SECURE_LOCAL_STORAGE_HASH_KEY=${{ secrets.REACT_APP_SECURE_LOCAL_STORAGE_HASH_KEY }}
            REACT_APP_SECURE_LOCAL_STORAGE_PREFIX=${{ secrets.REACT_APP_SECURE_LOCAL_STORAGE_PREFIX }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            EOF

            log "✅ .env.production created successfully."
            log "Environment variables count: $(cat .env.production | wc -l)"

            # Verify all required vars are set
            if ! grep -q "NEXTAUTH_URL" .env.production || ! grep -q "NEXT_PUBLIC_API_BASE_URL" .env.production; then
              log "❌ Required environment variables missing!"
              exit 1
            fi

            # 4️⃣ Build new Docker image with BuildKit cache
            log "📦 Building Docker image with BuildKit cache..."
            BUILD_START=$(date +%s)

            DOCKER_BUILDKIT=1 docker build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }} \
              --cache-from docuhub-frontend:latest \
              --progress=plain \
              -t docuhub-frontend:latest \
              -t docuhub-frontend:$(date +%Y%m%d-%H%M%S) \
              . 2>&1 | tail -20

            BUILD_END=$(date +%s)
            BUILD_TIME=$((BUILD_END - BUILD_START))
            log "✅ Build completed in ${BUILD_TIME}s"

            # Check image size
            IMAGE_SIZE=$(docker images docuhub-frontend:latest --format "{{.Size}}")
            log "📦 Image size: $IMAGE_SIZE"

            # 5️⃣ Run new container on temporary port for health check
            log "🚀 Starting new Docker container on port 3001..."
            docker run -d \
              -p 3001:3000 \
              --env-file .env.production \
              --name docuhub-frontend-new \
              --memory="1g" \
              --memory-swap="1g" \
              --cpus="2" \
              --restart unless-stopped \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              docuhub-frontend:latest

            # Wait for container to start
            log "⏳ Waiting for container to initialize..."
            sleep 8

            # Debug: Show all containers
            log "📋 All containers:"
            docker ps -a | grep docuhub || true

            # Check if container is running
            CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' docuhub-frontend-new 2>/dev/null || echo "not-found")
            log "Container status: $CONTAINER_STATUS"

            if [ "$CONTAINER_STATUS" != "running" ]; then
              log "❌ Container is not running! Status: $CONTAINER_STATUS"
              log "Container logs:"
              docker logs docuhub-frontend-new 2>&1 || true
              log "Container inspect:"
              docker inspect docuhub-frontend-new || true
              exit 1
            fi

            log "✅ Container is running!"

            # 6️⃣ Health check - wait for app to be ready
            log "🏥 Running health check..."
            HEALTH_CHECK_PASSED=false
            MAX_ATTEMPTS=12

            for i in $(seq 1 $MAX_ATTEMPTS); do
              log "Health check attempt $i/$MAX_ATTEMPTS..."
              
              # Check if container is still running
              if ! docker ps | grep -q docuhub-frontend-new; then
                log "❌ Container stopped unexpectedly!"
                docker logs --tail 50 docuhub-frontend-new
                exit 1
              fi
              
              # Try to connect
              if curl -f -s -o /dev/null -w "%{http_code}" http://localhost:3001 | grep -q "200"; then
                log "✅ Health check passed on attempt $i!"
                HEALTH_CHECK_PASSED=true
                break
              else
                if [ $i -eq $MAX_ATTEMPTS ]; then
                  log "❌ Health check failed after $MAX_ATTEMPTS attempts"
                  log "Container logs:"
                  docker logs --tail 50 docuhub-frontend-new
                else
                  log "⏳ Retrying in 5s..."
                  sleep 5
                fi
              fi
            done

            # 7️⃣ Switch traffic or rollback
            if [ "$HEALTH_CHECK_PASSED" = true ]; then
              log "🔄 Switching traffic to new container..."
              
              # Stop and remove old container if exists
              if docker ps -a | grep -q "docuhub-frontend-container"; then
                log "🛑 Stopping old container..."
                docker stop docuhub-frontend-container 2>/dev/null || true
                docker rm docuhub-frontend-container 2>/dev/null || true
              fi

              # Stop and remove the test container on port 3001
              docker stop docuhub-frontend-new
              docker rm docuhub-frontend-new
              
              # Wait for ports to be released
              log "⏳ Waiting for ports to be released..."
              sleep 3
              
              # Verify port 3000 is free, if not kill the process
              if lsof -ti:3000 >/dev/null 2>&1; then
                log "⚠️ Port 3000 still in use, force killing process..."
                lsof -ti:3000 | xargs kill -9 2>/dev/null || true
                sleep 2
              fi
              
              # Start new container on port 3000 with production name
              log "🚀 Starting production container on port 3000..."
              docker run -d \
                -p 3000:3000 \
                --env-file .env.production \
                --name docuhub-frontend-container \
                --memory="1g" \
                --memory-swap="1g" \
                --cpus="2" \
                --restart unless-stopped \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                docuhub-frontend:latest
              
              # Wait and verify
              sleep 5
              
              if curl -f -s http://localhost:3000 > /dev/null; then
                log "✅ New container responding on port 3000!"
              else
                log "❌ New container not responding on port 3000!"
                log "Container logs:"
                docker logs --tail 50 docuhub-frontend-container
                exit 1
              fi

              log "✅ Deployment finished successfully!"

              # 8️⃣ Cleanup old images (keep last 3 versions)
              log "🗑️ Cleaning up old Docker images..."
              docker image prune -f
              docker images | grep docuhub-frontend | tail -n +4 | awk '{print $3}' | xargs -r docker rmi 2>/dev/null || true
              
              # Show disk space after cleanup
              df -h / | tail -1 | awk '{print "Available disk space after cleanup: " $4}'
            else
              log "❌ Health check failed! Rolling back..."
              docker stop docuhub-frontend-new 2>/dev/null || true
              docker rm docuhub-frontend-new 2>/dev/null || true
              log "⚠️ Old container still running (if it existed)"
              exit 1
            fi

            # 9️⃣ Verify final deployment
            log "📊 Final deployment status:"
            log "Running containers:"
            docker ps --filter "name=docuhub-frontend" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            log "Container health:"
            docker inspect docuhub-frontend-container --format='{{.State.Health.Status}}' || echo "No health status"

            log "Memory usage:"
            docker stats --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}" docuhub-frontend-container

            log "Testing endpoint:"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
            if [ "$HTTP_CODE" = "200" ]; then
              log "✅ App responding with HTTP $HTTP_CODE"
            else
              log "⚠️ App responding with HTTP $HTTP_CODE"
            fi

            log "🎉 Deployment complete!"
