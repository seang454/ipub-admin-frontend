# ==========================================
# 🐳 Docker Compose for DocuHub Admin
# ==========================================
# Usage:
#   Development: docker-compose up
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# ==========================================

version: "3.9"

services:
  # ==========================================
  # 🚀 Next.js Frontend Application
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: docuhub-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    env_file:
      - .env.production
    networks:
      - docuhub-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your VM)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  docuhub-network:
    driver: bridge
# ==========================================
# 📝 Usage Examples:
# ==========================================
#
# Start services:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f frontend
#
# Stop services:
#   docker-compose down
#
# Rebuild and restart:
#   docker-compose up -d --build
#
# Check status:
#   docker-compose ps
# ==========================================

